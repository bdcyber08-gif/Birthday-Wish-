<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎂 শুভ জন্মদিন 🎉</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Hind Siliguri',sans-serif;
min-height:100vh;
overflow-x:hidden;
background: radial-gradient(circle,#ff00cc,#3333ff,#00ffcc);
background-size:400% 400%;
animation:bg 10s ease infinite;
color:white;
text-align:center;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
padding:40px 15px;
max-width:800px;
margin:auto;
}

.card{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(18px);
border-radius:30px;
padding:30px;
border:1px solid rgba(255,255,255,0.2);
box-shadow:0 0 40px rgba(255,255,255,0.3);
}

h1{
font-size:45px;
animation:color 3s infinite;
}

@keyframes color{
0%{color:#ff4d4d;}
25%{color:#00ffff;}
50%{color:#ffff00;}
75%{color:#00ff66;}
100%{color:#ff00ff;}
}

.photo{
width:220px;
height:220px;
border-radius:25px;
object-fit:cover;
border:5px solid white;
box-shadow:0 0 25px #fff,0 0 60px #ff00ff;
margin-top:20px;
}

.text{
font-size:22px;
margin-top:20px;
line-height:38px;
}

.btn{
margin-top:25px;
padding:15px 35px;
border:none;
border-radius:50px;
font-size:20px;
cursor:pointer;
background:gold;
font-weight:bold;
box-shadow:0 0 20px white;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

/* Balloons */
.balloon{
position:fixed;
bottom:-150px;
animation:fly linear;
z-index:1;
}

@keyframes fly{
to{
transform:translateY(-120vh) rotate(360deg);
}
}

/* Firework */
.firework{
position:fixed;
width:12px;
height:12px;
border-radius:50%;
animation:boom 1.2s ease-out forwards;
z-index:2;
}

@keyframes boom{
0%{transform:scale(0);opacity:1;}
100%{transform:scale(20);opacity:0;}
}

</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🎂 শুভ জন্মদিন 🎉</h1>

<img src="osman.jpg" class="photo">

<div class="text">
💖 তোমার জীবন হোক সুখ, ভালোবাসা আর সফলতায় ভরা ✨
</div>

<button class="btn" onclick="startParty()">
🎉 শুরু করুন
</button>

</div>
</div>

<!-- SOUND -->
<audio id="boomSound" preload="auto">
<source src="https://www.soundjay.com/explosion/explosion-01.mp3">
</audio>

<script>

/* 🎆 FIREWORK + SOUND SYNC */
function createFirework(){

let sound = document.getElementById("boomSound");

/* position */
let x = Math.random() * 100;
let y = Math.random() * 80;

/* firework */
let fire = document.createElement("div");
fire.className = "firework";
fire.style.left = x + "vw";
fire.style.top = y + "vh";
fire.style.background = `hsl(${Math.random()*360},100%,60%)`;

document.body.appendChild(fire);

/* 🔊 PERFECT SYNC SOUND */
let audioClone = sound.cloneNode();
audioClone.volume = 0.8;
audioClone.play();

/* remove */
setTimeout(()=>{
fire.remove();
audioClone.remove();
},1200);

}

/* 🎉 FULL PARTY SYSTEM */
function startParty(){

/* balloons */
let balloonInterval = setInterval(()=>{

let b = document.createElement("img");
b.src = "https://cdn-icons-png.flaticon.com/512/3468/3468371.png";
b.className = "balloon";
b.style.left = Math.random()*100 + "vw";
b.style.width = (40 + Math.random()*50) + "px";
b.style.animationDuration = (4 + Math.random()*5) + "s";

document.body.appendChild(b);

setTimeout(()=>b.remove(),9000);

},250);

/* fireworks */
let fireInterval = setInterval(()=>{
createFirework();
}, 250 + Math.random()*300);

/* stop after 4 sec */
setTimeout(()=>{
clearInterval(balloonInterval);
clearInterval(fireInterval);
},4000);

}

</script>

</body>
</html>
