<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>

body{
    margin:0;
    overflow-x:hidden;
    font-family:Arial;
    text-align:center;
    background:linear-gradient(135deg,#ff4e8d,#6a5cff);
    color:white;
}

/* Balloon Animation */

.balloon{
    position:fixed;
    bottom:-150px;
    width:80px;
    animation:floatUp 10s linear infinite;
    z-index:1;
}

.balloon:nth-child(1){
    left:10%;
    animation-duration:8s;
}

.balloon:nth-child(2){
    left:30%;
    animation-duration:10s;
}

.balloon:nth-child(3){
    left:50%;
    animation-duration:7s;
}

.balloon:nth-child(4){
    left:70%;
    animation-duration:9s;
}

.balloon:nth-child(5){
    left:90%;
    animation-duration:11s;
}

@keyframes floatUp{
    0%{
        transform:translateY(0);
        opacity:1;
    }

    100%{
        transform:translateY(-120vh);
        opacity:0;
    }
}

.container{
    position:relative;
    z-index:2;
    padding:20px;
}

h1{
    margin-top:20px;
    font-size:50px;
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px white;
    }

    to{
        text-shadow:0 0 30px yellow;
    }
}

.photo{
    width:260px;
    height:260px;
    object-fit:cover;
    border-radius:25px;
    border:5px solid white;
    margin-top:20px;
    box-shadow:0 0 25px black;
}

.caption{
    font-size:24px;
    margin-top:20px;
    padding:10px;
}

/* Video */

video{
    width:90%;
    max-width:600px;
    margin-top:25px;
    border-radius:20px;
    box-shadow:0 0 25px black;
    background:black;
}

.footer{
    margin-top:30px;
    font-size:20px;
    padding-bottom:40px;
}

</style>
</head>

<body>

<!-- Balloons -->

<img src="https://cdn-icons-png.flaticon.com/512/3468/3468371.png" class="balloon">
<img src="https://cdn-icons-png.flaticon.com/512/3468/3468371.png" class="balloon">
<img src="https://cdn-icons-png.flaticon.com/512/3468/3468371.png" class="balloon">
<img src="https://cdn-icons-png.flaticon.com/512/3468/3468371.png" class="balloon">
<img src="https://cdn-icons-png.flaticon.com/512/3468/3468371.png" class="balloon">

<div class="container">

<h1>🎉 Happy Birthday 🎂</h1>

<img src="friend.jpg" class="photo">

<div class="caption">
💖 Happy Birthday My Best Friend 🎈 <br>
May your life be full of happiness and success ✨
</div>

<!-- Video -->

<video controls autoplay>
    <source src="birthday.mp4" type="video/mp4">
</video>

<div class="footer">
Made With ❤️ By Your Best Friend
</div>

</div>

</body>
  </html>
