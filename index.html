<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial;
    background:linear-gradient(135deg,#ff0080,#7928ca,#00c6ff);
    background-size:400% 400%;
    animation:bgMove 10s infinite alternate;
    text-align:center;
    color:white;
}

@keyframes bgMove{
    0%{background-position:left;}
    100%{background-position:right;}
}

/* RGB Text */

.rgb{
    animation:rgb 2s infinite linear;
    text-shadow:0 0 15px white;
}

@keyframes rgb{
    0%{color:#ff0000;}
    25%{color:#00ff00;}
    50%{color:#00ffff;}
    75%{color:#ffff00;}
    100%{color:#ff00ff;}
}

/* Main Box */

.container{
    position:relative;
    z-index:2;
    padding-top:40px;
}

/* Birthday Title */

.title{
    font-size:55px;
    font-weight:bold;
    line-height:80px;
}

/* Photo */

.photo{
    width:210px;
    height:210px;
    object-fit:cover;
    border-radius:30px;
    border:5px solid white;
    margin-top:25px;
    box-shadow:
    0 0 20px #fff,
    0 0 40px #ff00ff,
    0 0 60px #00ffff;
}

/* Caption */

.caption{
    margin-top:25px;
    font-size:28px;
    padding:15px;
    line-height:45px;
    font-weight:bold;
}

/* Video */

video{
    width:90%;
    max-width:550px;
    margin-top:20px;
    border-radius:25px;
    border:4px solid white;
    box-shadow:
    0 0 20px white,
    0 0 40px #ff00ff;
    background:black;
}

/* Balloons */

.balloon{
    position:absolute;
    bottom:-200px;
    width:70px;
    animation:fly linear forwards;
}

@keyframes fly{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(-130vh) rotate(360deg);
        opacity:0;
    }
}

/* Firework Bomb */

.firework{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background:white;
    animation:boom 1.5s infinite;
}

@keyframes boom{
    0%{
        transform:scale(0);
        opacity:1;
    }

    100%{
        transform:scale(15);
        opacity:0;
    }
}

</style>
</head>

<body>

<!-- Fireworks -->

<div class="firework" style="top:15%; left:20%;"></div>
<div class="firework" style="top:20%; left:70%;"></div>
<div class="firework" style="top:60%; left:50%;"></div>

<!-- Balloons -->

<script>

for(let i=0;i<25;i++){

    let balloon=document.createElement("img");

    balloon.src="https://cdn-icons-png.flaticon.com/512/3468/3468371.png";

    balloon.className="balloon";

    balloon.style.left=Math.random()*100+"vw";

    balloon.style.animationDuration=
    (5+Math.random()*5)+"s";

    balloon.style.width=
    (50+Math.random()*40)+"px";

    document.body.appendChild(balloon);
}

</script>

<div class="container">

<div class="title rgb">
🎉 Happy <br> Birthday 🎂
</div>

<!-- Friend Photo -->

<img src="Osman.jpg" class="photo">

<!-- Caption -->

<div class="caption rgb">
💖 Happy Birthday My Best Friend 🎈 <br>
May your life be full of happiness and success ✨
</div>

<!-- Video -->

<video controls autoplay>
<source src="funny.mp4" type="video/mp4">
</video>

</div>

</body>
</html>
