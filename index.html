<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎂 শুভ জন্মদিন 🎉</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Hind Siliguri',sans-serif;
    overflow-x:hidden;
    min-height:100vh;
    background:linear-gradient(-45deg,#ff0080,#7928ca,#00c6ff,#00ff99);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
    color:white;
}

/* Background */
@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Loader */
.loader{
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
    transition:1s;
}

.loader h1{
    animation:rgb 2s linear infinite;
}

@keyframes rgb{
    0%{color:#ff4d4d;}
    25%{color:#00ffcc;}
    50%{color:#ffff66;}
    75%{color:#66ff66;}
    100%{color:#ff66ff;}
}

/* Container */
.container{
    max-width:750px;
    margin:auto;
    padding:30px 15px 100px;
}

.card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);
    border-radius:30px;
    padding:25px;
    text-align:center;
}

/* Title */
.title{
    font-size:45px;
    font-weight:bold;
    animation:rgb 3s infinite;
}

/* Photo */
.photo{
    width:200px;
    height:200px;
    border-radius:25px;
    margin-top:20px;
    border:4px solid white;
}

/* Caption typing */
.caption{
    margin-top:25px;
    font-size:22px;
    font-weight:bold;
    min-height:40px;
}

#typing::after{
    content:"|";
    animation:blink 0.7s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}

/* Button */
.fb-btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    background:white;
    color:#1877f2;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
}

/* Video */
video{
    width:100%;
    margin-top:25px;
    border-radius:20px;
}

/* 🎈 BALLOON */
.balloon{
    position:fixed;
    bottom:-120px;
    z-index:1;
    opacity:0.9;
    animation:fly linear forwards;
}

/* Realistic floating */
@keyframes fly{
    0%{
        transform:translateY(0) translateX(0) rotate(0deg);
        opacity:0;
    }
    10%{
        opacity:1;
    }
    50%{
        transform:translateY(-60vh) translateX(var(--drift)) rotate(180deg);
    }
    100%{
        transform:translateY(-120vh) translateX(calc(var(--drift) * 1.5)) rotate(360deg);
        opacity:0;
    }
}

</style>
</head>

<body>

<!-- Loader -->
<div class="loader" id="loader">
<h1>🎉 Loading...</h1>
</div>

<div class="container">

<div class="card">

<div class="title">🎂 শুভ জন্মদিন 🎉</div>

<img src="osman.jpg" class="photo">

<div class="caption">
<span id="typing"></span>
</div>

<a class="fb-btn" href="https://www.facebook.com/share/18xQ1zkKxu/" target="_blank">
📘 Facebook Profile
</a>

<video controls autoplay>
<source src="funny.mp4" type="video/mp4">
</video>

</div>
</div>

<script>

/* Loader */
setTimeout(()=>{
    document.getElementById("loader").style.display="none";
},2000);

/* Typing Caption (EDITABLE) */
const texts = [
"🎂 শুভ জন্মদিন",
"💖 সুখে থাকো",
"✨ সব শুভ হোক",
"🎉 Happy Day",
"💫 Always Smile",
"💝 Stay Blessed"
];

let count = 0;
let index = 0;

function type(){
    let current = texts[count];
    let text = current.slice(0, ++index);

    document.getElementById("typing").textContent = text;

    if(text.length === current.length){
        setTimeout(()=>{
            index = 0;
            count++;
            if(count === texts.length) count = 0;
            setTimeout(type, 500);
        },1200);
    }else{
        setTimeout(type, 100);
    }
}

type();

/* 🎈 REALISTIC BALLOON */
function createBalloon(){

    let balloon = document.createElement("img");

    balloon.src = "https://cdn-icons-png.flaticon.com/512/3468/3468371.png";
    balloon.className = "balloon";

    let size = 40 + Math.random() * 50;
    balloon.style.width = size + "px";

    let startX = Math.random() * window.innerWidth;
    balloon.style.left = startX + "px";

    let duration = 6 + Math.random() * 6;
    balloon.style.animationDuration = duration + "s";

    let drift = (Math.random() * 100 - 50);
    balloon.style.setProperty("--drift", drift + "px");

    document.body.appendChild(balloon);

    setTimeout(()=>{
        balloon.remove();
    }, duration * 1000);
}

/* continuous balloons */
setInterval(createBalloon, 400);

</script>

</body>
</html>
