<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Happy Birthday 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(-45deg,#ff0080,#7928ca,#00c6ff,#00ff99);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
    overflow-x:hidden;
    min-height:100vh;
    color:white;
}

/* Animated Background */

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Scroll Fix */

html{
    scroll-behavior:smooth;
}

/* Main Container */

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:30px 15px 80px;
    text-align:center;
    position:relative;
    z-index:5;
}

/* Glass Card */

.card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:30px;
    padding:25px;
    box-shadow:
    0 0 25px rgba(255,255,255,0.2);
}

/* RGB Text */

.rgb{
    animation:rgb 3s linear infinite;
}

@keyframes rgb{
    0%{color:#ff4d4d;}
    25%{color:#00ffcc;}
    50%{color:#ffff66;}
    75%{color:#66ff66;}
    100%{color:#ff66ff;}
}

/* Title */

.title{
    font-size:55px;
    line-height:75px;
    font-weight:700;
    margin-bottom:20px;
    text-shadow:0 0 20px rgba(255,255,255,0.8);
}

/* Photo */

.photo-box{
    position:relative;
    display:inline-block;
    margin-top:10px;
}

.photo{
    width:230px;
    height:230px;
    border-radius:25px;
    object-fit:cover;
    border:5px solid white;
    box-shadow:
    0 0 20px #fff,
    0 0 40px #ff00ff,
    0 0 70px #00ffff;
}

/* Glow Ring */

.photo-box::after{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:30px;
    border:3px solid rgba(255,255,255,0.4);
    animation:rotate 6s linear infinite;
}

@keyframes rotate{
    100%{
        transform:rotate(360deg);
    }
}

/* Caption */

.caption{
    margin-top:25px;
    font-size:24px;
    line-height:40px;
    font-weight:600;
}

/* Video */

.video-box{
    margin-top:30px;
}

video{
    width:100%;
    border-radius:20px;
    border:4px solid white;
    box-shadow:
    0 0 25px rgba(255,255,255,0.6);
    background:black;
}

/* Button */

.btn{
    display:inline-block;
    margin-top:25px;
    padding:14px 30px;
    border-radius:50px;
    background:white;
    color:#ff0080;
    font-weight:bold;
    text-decoration:none;
    transition:0.4s;
    box-shadow:0 0 15px white;
}

.btn:hover{
    transform:scale(1.08);
    background:#ff0080;
    color:white;
}

/* Floating Balloons */

.balloon{
    position:fixed;
    bottom:-150px;
    width:70px;
    z-index:1;
    animation:fly linear infinite;
    opacity:0.9;
}

@keyframes fly{
    0%{
        transform:translateY(0) rotate(0deg);
    }

    100%{
        transform:translateY(-130vh) rotate(360deg);
    }
}

/* Fireworks */

.firework{
    position:fixed;
    width:12px;
    height:12px;
    border-radius:50%;
    z-index:0;
    animation:boom 2s infinite;
}

.firework:nth-child(1){
    background:#ff0;
}

.firework:nth-child(2){
    background:#0ff;
}

.firework:nth-child(3){
    background:#ff00ff;
}

@keyframes boom{
    0%{
        transform:scale(0);
        opacity:1;
    }

    100%{
        transform:scale(18);
        opacity:0;
    }
}

/* Responsive */

@media(max-width:600px){

.title{
    font-size:40px;
    line-height:60px;
}

.photo{
    width:180px;
    height:180px;
}

.caption{
    font-size:19px;
    line-height:32px;
}

}

</style>
</head>

<body>

<!-- Fireworks -->

<div class="firework" style="top:15%; left:20%;"></div>
<div class="firework" style="top:20%; left:75%;"></div>
<div class="firework" style="top:60%; left:50%;"></div>

<!-- Balloons Script -->

<script>

for(let i=0;i<20;i++){

    let balloon=document.createElement("img");

    balloon.src="https://cdn-icons-png.flaticon.com/512/3468/3468371.png";

    balloon.className="balloon";

    balloon.style.left=Math.random()*100+"vw";

    balloon.style.animationDuration=
    (6+Math.random()*6)+"s";

    balloon.style.width=
    (50+Math.random()*30)+"px";

    document.body.appendChild(balloon);
}

</script>

<!-- Main -->

<div class="container">

<div class="card">

<div class="title rgb">
🎉 Happy Birthday 🎂
</div>

<div class="photo-box">
<img src="osman.jpg" class="photo">
</div>

<div class="caption rgb">
💖 Happy Birthday My Best Friend 🎈 <br>
May your life be filled with happiness, love & success ✨
</div>

<div class="video-box">
<video controls autoplay>
<source src="funny.mp4" type="video/mp4">
</video>
</div>

<a href="#" class="btn">
🎁 Enjoy Your Day
</a>

</div>

</div>

</body>
</html>
