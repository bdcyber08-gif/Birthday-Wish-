<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>শুভ জন্মদিন 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Hind Siliguri',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    background:linear-gradient(-45deg,#ff0080,#7928ca,#00c6ff,#00ff99);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
    color:white;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Main Box */

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:30px 15px 80px;
    position:relative;
    z-index:5;
}

.card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    border-radius:30px;
    padding:25px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 0 30px rgba(255,255,255,0.2);
}

/* RGB Text */

.rgb{
    animation:rgb 3s linear infinite;
}

@keyframes rgb{
    0%{color:#ff4d4d;}
    25%{color:#00ffcc;}
    50%{color:#ffff66;}
    75%{color:#66ff66;}
    100%{color:#ff66ff;}
}

/* Title */

.title{
    font-size:52px;
    font-weight:700;
    line-height:75px;
    text-shadow:0 0 20px white;
}

/* Photo */

.photo-box{
    margin-top:25px;
    position:relative;
    display:inline-block;
}

.photo{
    width:230px;
    height:230px;
    object-fit:cover;
    border-radius:25px;
    border:5px solid white;
    box-shadow:
    0 0 20px white,
    0 0 40px #ff00ff,
    0 0 70px #00ffff;
}

/* Caption */

.caption{
    margin-top:25px;
    font-size:25px;
    line-height:42px;
    font-weight:bold;
}

/* Facebook Button */

.fb-btn{
    display:inline-block;
    margin-top:25px;
    padding:15px 35px;
    border-radius:50px;
    background:white;
    color:#1877f2;
    font-size:20px;
    font-weight:bold;
    text-decoration:none;
    transition:0.4s;
    box-shadow:0 0 20px white;
}

.fb-btn:hover{
    transform:scale(1.08);
    background:#1877f2;
    color:white;
}

/* Video */

.video-box{
    margin-top:30px;
}

video{
    width:100%;
    border-radius:20px;
    border:4px solid white;
    box-shadow:0 0 25px rgba(255,255,255,0.7);
}

/* Balloon */

.balloon{
    position:fixed;
    bottom:-150px;
    z-index:1;
    animation:fly linear infinite;
    opacity:0.9;
}

@keyframes fly{
    0%{
        transform:translateY(0) rotate(0deg);
    }

    100%{
        transform:translateY(-130vh) rotate(360deg);
    }
}

/* Firework */

.firework{
    position:fixed;
    width:12px;
    height:12px;
    border-radius:50%;
    z-index:0;
    animation:boom 2s infinite;
}

.firework:nth-child(1){
    background:#ffff00;
}

.firework:nth-child(2){
    background:#00ffff;
}

.firework:nth-child(3){
    background:#ff00ff;
}

@keyframes boom{
    0%{
        transform:scale(0);
        opacity:1;
    }

    100%{
        transform:scale(18);
        opacity:0;
    }
}

/* Responsive */

@media(max-width:600px){

.title{
    font-size:38px;
    line-height:60px;
}

.photo{
    width:180px;
    height:180px;
}

.caption{
    font-size:20px;
    line-height:34px;
}

.fb-btn{
    font-size:18px;
    padding:13px 28px;
}

}

</style>
</head>

<body>

<!-- Fireworks -->

<div class="firework" style="top:15%; left:20%;"></div>
<div class="firework" style="top:25%; left:75%;"></div>
<div class="firework" style="top:60%; left:50%;"></div>

<!-- Balloon Script -->

<script>

for(let i=0;i<30;i++){

    let balloon=document.createElement("img");

    balloon.src="https://cdn-icons-png.flaticon.com/512/3468/3468371.png";

    balloon.className="balloon";

    balloon.style.left=Math.random()*100+"vw";

    balloon.style.width=(50+Math.random()*40)+"px";

    balloon.style.animationDuration=
    (6+Math.random()*6)+"s";

    balloon.style.animationDelay=
    Math.random()*5+"s";

    document.body.appendChild(balloon);
}

</script>

<!-- Main -->

<div class="container">

<div class="card">

<div class="title rgb">
🎂 শুভ জন্মদিন 🎉
</div>

<div class="photo-box">
<img src="osman.jpg" class="photo">
</div>

<div class="caption rgb">
💖 তোমার জীবনের প্রতিটি দিন <br>
সুখ, ভালোবাসা আর সফলতায় ভরে উঠুক ✨
</div>

<a href="https://www.facebook.com/share/18xQ1zkKxu/" target="_blank" class="fb-btn">
📘 ফেসবুক প্রোফাইল দেখুন
</a>

<div class="video-box">
<video controls autoplay>
<source src="funny.mp4" type="video/mp4">
</video>
</div>

</div>

</div>

</body>
</html>
